# XcodeGen spec: run `xcodegen generate` after changing this file or adding/removing files.
name: HeistRoyale
options:
  bundleIdPrefix: com.benostudio
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    DEVELOPMENT_TEAM: TNBCR36YPJ
    CODE_SIGN_STYLE: Automatic
packages:
  HeistCore:
    path: HeistCore
targets:
  HeistRoyale:
    type: application
    platform: iOS
    sources:
      - path: App
    dependencies:
      - package: HeistCore
    entitlements:
      path: App/HeistRoyale.entitlements
      properties:
        com.apple.developer.game-center: true
    # Keys the INFOPLIST_KEY_* settings can't express; Xcode merges the generated keys into this file.
    info:
      path: App/Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UIAppFonts:
          - Bungee-Regular.ttf
          - Fredoka.ttf
          - NunitoSans.ttf
          - Baloo2.ttf
        UILaunchScreen:
          UIColorName: LaunchBackground
    settings:
      base:
        PRODUCT_NAME: HeistRoyale
        PRODUCT_BUNDLE_IDENTIFIER: com.benostudio.heistroyale
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Heist Royale
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.strategy-games
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_PREVIEWS: YES
    scheme:
      testTargets:
        - package: HeistCore/HeistCoreTests
