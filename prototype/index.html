      <circle class="compass-dot" cx="${f1(l.x)}" cy="${f1(l.y)}" r="9"/><text class="compass-num" x="${f1(l.x)}" y="${f1(l.y)}">${cp.dist}</text>`;
  }
  paintBoard(R, cells, over);
}

function trail(path, k, color, off) {
  const segs = [[]];
  for (const p of path.filter(p => p.turn <= k)) {
    if (p.jump) segs.push([]);
    const c = XY(p);
    segs[segs.length - 1].push([f1(c.x + off), f1(c.y + off)]);
  }
  return segs.filter(s => s.length).map(pts =>
    `<polyline points="${pts.map(p => p.join(',')).join(' ')}" fill="none" style="stroke:var(${color})" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" opacity=".85"/>` +
    pts.map(([x, y]) => `<circle cx="${x}" cy="${y}" r="2.6" style="fill:var(${color})"/>`).join('')
  ).join('');
}

function renderReplay(g) {
  const R = g.cfg.radius, k = ui.replayK, snap = g.history[k], final = k === g.history.length - 1, o = g.over;
  const rocks = new Set(snap.rocks);
  let cells = '';
  for (const c of g.cells) {
    const x = { cls: ['hex', 'vis'], pieces: [], items: [], titles: [] };
    terrainBits(g, c, x, rocks);
    if (g.exits.some(e => eq(e, c))) { x.items.push({ icon: ICON.exit }); x.titles.push('Exit'); }
    const ci = g.chests.findIndex(ch => eq(ch, c));
    if (ci >= 0) { x.items.push({ icon: ICON.chest, cls: snap.looted[ci] ? 'looted' : '' }); x.titles.push(snap.looted[ci] ? 'Chest (robbed)' : 'Chest'); }
    if (snap.boxes.some(b => eq(b, c))) { x.items.push({ icon: ICON.box }); x.titles.push('Power-up box'); }
    if (snap.traps.some(t => eq(t, c))) { x.items.push({ icon: ICON.trap }); x.titles.push('Trap'); }
    if (snap.decoys.some(d => eq(d, c))) { x.items.push({ icon: ICON.decoy }); x.titles.push('Decoy'); }
    const hasT = eq(c, snap.t), hasP = eq(c, snap.p);
    if (hasP) x.pieces.push({ icon: ROLES.police.icon });
    if (hasT) x.pieces.push({ icon: ROLES.thief.icon });
    if (hasT && !hasP) x.pieces.reverse();
    if (final && o.reason === 'caught' && (hasT || hasP)) x.cls.push('caught');
    if (final && o.reason === 'escaped' && hasT) x.cls.push('escaped');
    cells += cellSVG(R, c, x);
  }
  const over = snap.walls.map(w => wallSVG(w)).join('') +
    trail(g.police.path, k, '--police', 3.5) + trail(g.thief.path, k, '--thief', -3.5);
  paintBoard(R, cells, over);
}

/* ---------- panel ---------- */
function renderPanel() {
  if (ui.screen === 'plan') panelEl.innerHTML = planPanel();
  else if (ui.screen === 'over') panelEl.innerHTML = overPanel();
  else panelEl.innerHTML = '';
}

function logHTML(side, freshFrom, newestFirst) {
  const entries = newestFirst ? side.log.slice().reverse() : side.log;
  return entries.map(e =>
    `<div class="entry ${e.turn >= freshFrom ? 'fresh' : ''} ${e.kind}"><span class="t">${e.turn === 0 ? 'Start' : 'T' + e.turn}</span><span>${e.text}</span></div>`
  ).join('');
}

const AIM_HINT = {
  trap: 'Tap a gold-ringed tile next to you to hide the trap.',
  decoy: 'Tap a gold-ringed tile next to you for the decoy.',
  net: 'Tap a gold-ringed tile (up to 2 away) to throw the net.',
  wall: 'Tap a gold dashed edge near you to build the wall.',
  hammer: 'Tap a gold-ringed rock or a highlighted wall next to you.',
};
function armedText(g, pw) {
  switch (pw.type) {
    case 'trap': return `🪤 Trap goes on <b>${nm(g, pw.cell)}</b> before anyone moves.`;
    case 'decoy': return `🎭 Decoy goes on <b>${nm(g, pw.cell)}</b> before anyone moves.`;
    case 'net': return `🕸️ Net lands on <b>${nm(g, pw.cell)}</b> after everyone moves.`;
    case 'wall': return `🧱 Wall goes up between <b>${nm(g, pw.a)}</b> and <b>${nm(g, pw.b)}</b> before anyone moves.`;
    case 'hammer': return pw.cell ? `🔨 You'll smash the rock on <b>${nm(g, pw.cell)}</b> before moving.` : `🔨 You'll smash the wall between <b>${nm(g, pw.a)}</b> and <b>${nm(g, pw.b)}</b> before moving.`;
    case 'smoke': return "💨 You'll vanish in smoke this turn and next.";
    case 'lockdown': return '🚨 Every exit gets sealed for 3 turns, starting now.';
    case 'run': return '👟 Running — pick <b>2 steps</b> this turn.';
  }
  return '';
}

function powerBox(g, role) {
  const s = g[role], p = ui.plan[role];
  const btns = POOL[role].map((t, i) => {
    const P = POWERS[t], on = (p.power && p.power.type === t) || ui.targeting === t;
    const ok = on || canUsePower(role, t);
    return `<button class="pw ${on ? 'on' : ''}" data-act="power" data-type="${t}" ${ok ? '' : 'disabled'} title="${P.name}: ${P.desc}">
      <span class="pw-icon">${P.icon}</span><span class="pw-name">${P.name}</span><span class="pw-count">×${s.items[t]} · ${i + 1}</span></button>`;
  }).join('');
  let status;
  if (ui.targeting) status = `${AIM_HINT[ui.targeting]} <kbd>Esc</kbd> cancels.`;
  else if (p.power) status = `${armedText(g, p.power)} Tap it again to cancel.`;
  else if (s.instantTurn === g.turn) status = 'You already used a power-up this turn.';
  else if (!POOL[role].some(t => s.items[t])) status = `None yet — step on a ${ICON.box} box to get one.`;
  else status = 'Optional · one per turn. What each one does: Menu → Power-ups.';
  return `<div class="box"><div class="box-h">Power-ups</div><div class="pw-row">${btns}</div><div class="pw-status">${status}</div></div>`;
}

function effectChips(g, role) {
  const s = g[role], ref = g.turn - 1, out = [];
  if (s.stuck) out.push(`<span class="chip alert">😵 <b>Can't move this turn</b></span>`);
  if (isBush(g, s.pos)) out.push(`<span class="chip fx">🌿 <b>Hidden in a bush</b></span>`);
  if (role === 'thief' && s.smokeUntil >= ref) out.push(`<span class="chip fx">💨 <b>Invisible</b> through T${s.smokeUntil}</span>`);
  if (g.lockUntil >= g.turn) out.push(`<span class="chip alert">🚨 <b>Exits sealed</b> through T${g.lockUntil}</span>`);
  if (g.fx.fog >= ref) out.push(`<span class="chip fx">🌫️ <b>Fog</b> · vision ${visionOf(g, ref)}</span>`);
  if (g.fx.moon >= ref) out.push(`<span class="chip fx">🌕 <b>Full moon</b> · vision ${visionOf(g, ref)}</span>`);
  return out.join('');
}

const PAD = [['north-west', 'indent'], ['north-east', ''], ['west', ''], ['wait', 'wait'], ['east', ''], ['south-west', 'indent'], ['south-east', '']];

function planPanel() {
  const g = ui.game, cfg = g.cfg, role = ui.active, s = g[role], R = ROLES[role];
  const need = stepsNeeded(role), stuck = !!s.stuck, steps = planSteps(role);
  const ready = stuck || steps.length >= need;
  const turnsLeft = cfg.maxTurns - g.turn + 1;
  const modeLabel = ui.playMode === 'hotseat' ? '2 players · pass & play' : `vs AI ${ROLES[R.other].name.toLowerCase()}`;
  const lootNeed = cfg.lootToWin;
  let goal, chips;

  if (role === 'thief') {
    const left = lootNeed - s.loot;
    goal = left > 0
      ? `Find ${left === 1 ? 'a chest' : left + ' chests'} ${ICON.chest} — you don't know where they are — then escape through an exit ${ICON.exit}.`
      : `You've got the loot — reach an exit ${ICON.exit} without getting caught!`;
    chips = [`Loot <b>${s.loot}/${lootNeed}</b>`, `Chests spotted <b>${s.knownChests.size}/${g.chests.length}</b>`];
  } else {
    goal = `Catch the thief before turn ${cfg.maxTurns} ends. You know the chests ${ICON.chest}; the exits are hidden from you.`;
    chips = [`Chests robbed <b>${s.chestState.filter(Boolean).length}/${g.chests.length}</b>`, `Exits found <b>${s.knownExits.size}/${g.exits.length}</b>`];
  }
  const ls = s.lastSeenOpp;
  const seenTxt = !ls ? 'never' : (ls.turn === g.turn - 1 && s.oppVisible) ? 'now' : ls.via === 'radar' ? '📡 now' : ls.turn === 0 ? 'at start' : 'T' + ls.turn;
  chips.push(`${ROLES[R.other].name} last seen <b>${seenTxt}</b>`);
  const chipHTML = chips.map(c => `<span class="chip">${c}</span>`).join('') + effectChips(g, role);

  const news = s.log.filter(e => e.turn >= g.turn - 1 && (e.kind === 'alert' || e.kind === 'event'));
  const newsHTML = news.length ? `<div class="box news">${news.map(e => `<div class="news-item ${e.kind}">${e.text}</div>`).join('')}</div>` : '';

  const origin = stepOrigin(role);
  const legal = stuck ? [] : legalMoves(g, role, origin, planMods(role));
  const last = steps[steps.length - 1];
  const pad = PAD.map(([name, cls]) => {
    const m = moveByName(name);
    return `<button data-act="move" data-move="${name}" class="${cls} ${!stuck && last === m && steps.length === need ? 'sel' : ''}" ${legal.includes(m) && !ui.targeting ? '' : 'disabled'} aria-label="${cap(name)}">${m.label}</button>`;
  }).join('');

  const pts = walk(g, s.pos, steps);
  let plannedText;
  if (stuck) plannedText = "you can't move this turn";
  else if (!steps.length) plannedText = need === 2 ? 'pick step 1 of 2' : 'pick one';
  else plannedText = steps.map((m, i) => (need === 2 ? `${i + 1}. ` : '') + (isWait(m) ? 'wait' : `${m.name} → ${nm(g, pts[i])}`)).join(' · ') + (steps.length < need ? ' · now step 2' : '');
  const lockLabel = ui.playMode === 'hotseat' && role === 'thief' ? 'Lock in · pass to Police' : 'Lock in move';

  return `
  <div class="box">
    <div class="role-head">
      <span class="role-icon">${R.icon}</span>
      <div><div class="role-name">${R.name.toUpperCase()}</div><div class="muted small">${modeLabel}</div></div>
      <div class="turn"><b>Turn ${g.turn}</b><span class="muted"> / ${cfg.maxTurns}</span><div class="muted small">${plural(turnsLeft, 'turn')} left</div></div>
    </div>
    <div class="goal">${goal}</div>
    <div class="chips">${chipHTML}</div>
  </div>
  ${newsHTML}
  ${powerBox(g, role)}
  <div class="box">
    <div class="box-h">Your move <span class="muted small">${plannedText}</span></div>
    <div class="hexpad">${pad}</div>
    <button class="primary" data-act="lock" ${ready ? '' : 'disabled'}>${lockLabel}</button>
    <div class="hint">Tap a highlighted tile, or keys <kbd>W</kbd><kbd>E</kbd> <kbd>A</kbd><kbd>D</kbd> <kbd>Z</kbd><kbd>X</kbd> · <kbd>S</kbd> wait · <kbd>1</kbd>–<kbd>${POOL[role].length}</kbd> power-ups · <kbd>Enter</kbd> lock in</div>
  </div>
  <div class="box">
    <div class="box-h">What you know <span class="muted small">newest first</span></div>
    <div class="log">${logHTML(s, g.turn - 1, true)}</div>
  </div>
  <div class="row">
    <label class="toggle"><input type="checkbox" id="reveal" ${ui.debugReveal ? 'checked' : ''}> Reveal whole map (debug)</label>
    <button class="link-btn" data-act="menu">Menu</button>
  </div>`;
}

const replayLabel = k => k === 0 ? 'Start' : `After turn ${k}`;

function overPanel() {
  const g = ui.game, o = g.over, last = g.history.length - 1;
  const titles = {
    escaped: `${ROLES.thief.icon} The thief escaped!`,

    time: "⏰ Time's up — police wins",

  return `
  <div class="box result">
    <div class="eyebrow">${ROLES[o.winner].name} wins</div>
    <h2>${titles[o.reason]}</h2>
    <p class="muted">${o.detail}</p>

      <button data-act="rp-prev" aria-label="Previous turn">◀</button>

/* ---------- replay controls ---------- */
function setReplay(k) {
  ui.replayK = clamp(k, 0, ui.game.history.length - 1);
  renderBoard();
  const r = $('#rpRange'); if (r) r.value = ui.replayK;
  const l = $('#rpLabel'); if (l) l.textContent = replayLabel(ui.replayK);
}
function toggleReplay() {
  if (ui.replayTimer) return stopReplay();
  if (ui.replayK >= ui.game.history.length - 1) setReplay(0);
  ui.replayTimer = setInterval(() => {
    if (ui.replayK >= ui.game.history.length - 1) return stopReplay();
    setReplay(ui.replayK + 1);
  }, 550);
  updatePlayBtn();
}
function stopReplay() {
  clearInterval(ui.replayTimer);
  ui.replayTimer = null;
  updatePlayBtn();
}
function updatePlayBtn() {
  const b = $('[data-act="rp-play"]');
  if (b) b.textContent = ui.replayTimer ? 'Pause' : 'Play';
}

/* ---------- overlay: menu + pass-the-device screen ---------- */
function renderOverlay() {
  if (ui.screen === 'menu') { overlayEl.hidden = false; overlayEl.innerHTML = menuHTML(); }
  else if (ui.screen === 'cover') { overlayEl.hidden = false; overlayEl.innerHTML = coverHTML(); }
  else { overlayEl.hidden = true; overlayEl.innerHTML = ''; }
}

function rulesHTML(c) {
  const need = Math.min(c.lootToWin, c.chests);
  const sees = c.vision === 0 ? 'only your own tile' : c.vision === 1 ? 'your tile and the 6 around it' : `everything within ${c.vision} tiles`;
  return `
    <li><b>Thief ${ROLES.thief.icon}</b> knows where the ${c.exits === 1 ? 'exit 🚪 is' : 'exits 🚪 are'} but not the chests.
      ${need ? `Rob ${need === 1 ? 'a chest' : need + ' chests'} 💰 (step on it), then step on an exit.` : 'Step on an exit to escape.'}</li>
    <li><b>Police ${ROLES.police.icon}</b> knows where the ${c.chests === 1 ? 'chest 💰 is' : 'chests 💰 are'} but not the exits. Catch the thief before turn ${c.maxTurns} ends.</li>
    <li>Each turn you both secretly pick one of <b>6 directions</b> or wait. Both moves happen <b>at the same time</b>.</li>
    <li>You see ${sees}. Tiles you've explored stay mapped; your opponent's last known spot shows as a faded ghost.</li>
    <li>Caught = you end on the same tile${c.swapCatch ? ', or you swap places with each other' : ''}.${c.alarm ? ' Robbing a chest sets off an alarm the police hears.' : ''}</li>
    <li><b>Mystery boxes ${ICON.box}</b> appear now and then and both players see them. Step on one for a random power-up — ${c.boxSurprises ? 'sometimes two, sometimes it <b>explodes</b> and you lose a turn — ' : ''}but the other player sees it vanish. Use one power-up per turn; it happens before anyone moves.</li>`;
}

function listHTML(rows) {
  return rows.map(([icon, name, who, desc]) => `<div class="pw-item"><span class="pw-icon">${icon}</span>
    <div><b>${name}</b><span class="who ${who}">${who}</span><div class="muted small">${desc}</div></div></div>`).join('');
}
const TERRAIN_ROWS = [
  [ICON.rock, 'Rock', 'map', 'Blocks the tile. Nobody can walk through it — but a hammer can smash it.'],
  [ICON.bush, 'Bush', 'map', "Whoever stands inside can't be seen, even from right next to it. Step in to check!"],
  ['▬', 'Wall', 'map', 'Blocks the edge between two tiles. Grey walls come with the map; tan ones are built by the thief.'],
  [ICON.tunnel, 'Tunnel', 'map', 'Step into one end and you pop out of the other end in the same step.'],
];

function menuHTML() {
  const c = ui.cfg;
  const modes = [
    ['hotseat', '👥', '2 players', 'one device, pass & play'],
    ['thief', ROLES.thief.icon, 'Play Thief', 'vs AI police'],
    ['police', ROLES.police.icon, 'Play Police', 'vs AI thief'],
  ];
  const settings = SETTINGS.map(s => {
    if (s.group) return `<div class="set-group">${s.group}</div>`;
    const id = 'cfg-' + s.k;
    const input = s.type === 'bool'
      ? `<input type="checkbox" id="${id}" data-cfg="${s.k}" ${c[s.k] ? 'checked' : ''}>`
      : `<input type="number" id="${id}" data-cfg="${s.k}" min="${s.min}" max="${s.max}" value="${c[s.k]}">`;
    return `<label class="set-label" for="${id}">${s.label}${s.hint ? `<small>${s.hint}</small>` : ''}</label>${input}`;
  }).join('');
  const powers = Object.entries(POWERS).map(([, P]) => [P.icon, P.name, P.who, P.desc]);
  const events = Object.values(EVENTS).map(E => [E.icon, E.name, 'event', E.desc]);
  const resume = ui.game && !ui.game.over ? '<button class="secondary" data-act="resume">Resume current game</button>' : '';
  return `
  <div class="card">
    <h1>Heist Royale</h1>
    <p class="lead">A thief and the police on a hidden hex board. You both move <b>at the same time</b> and only see the tiles right around you — read your opponent and guess their next step.</p>
    <div class="label">Mode</div>
    <div class="seg">${modes.map(([m, em, t, sub]) =>
      `<button data-act="mode" data-mode="${m}" class="${ui.mode === m ? 'on' : ''}"><span class="em">${em}</span><span>${t}</span><span class="sub">${sub}</span></button>`).join('')}
    </div>
    <details open><summary>How to play</summary><ul id="rules">${rulesHTML(c)}</ul></details>
    <details><summary>The map</summary><div class="pw-list">${listHTML(TERRAIN_ROWS)}</div></details>
    <details><summary>Power-ups (${Object.keys(POWERS).length})</summary><div class="pw-list">${listHTML(powers)}</div></details>
    <details><summary>Random events</summary><div class="pw-list">${listHTML(events)}</div></details>
    <details id="settings"><summary>Rules &amp; settings</summary>
      <div class="settings-grid">${settings}</div>
      <div class="row" style="margin-top:14px">
        <button class="link-btn" data-act="reset-cfg">Reset to defaults</button>
        <button class="link-btn" data-act="simulate">Simulate 300 AI games</button>
      </div>
      <div class="sim" id="sim">${ui.simResult}</div>
    </details>
    <div class="menu-actions">
      ${resume}
      <button class="primary" data-act="start">Start new game</button>
    </div>
  </div>`;
}

function coverHTML() {
  const g = ui.game, R = ROLES[ui.active], O = ROLES[R.other];
  const sub = ui.active === 'police' ? `The thief has locked in a move. ${O.name}, look away!` : `${O.name}, look away!`;
  return `
  <div class="card cover">
    <div class="cover-icon">${R.icon}</div>
    <div class="muted small">Turn ${g.turn} of ${g.cfg.maxTurns}</div>
    <h2>Pass to the ${R.name}</h2>
    <p>${sub}</p>
    <button class="primary" data-act="show-view">I'm the ${R.name} — show my board</button>
    <div class="hint">or press <kbd>Enter</kbd></div>
  </div>`;
}

function runSim() {
  const N = 300, el = $('#sim');
  el.textContent = 'Simulating…';
  setTimeout(() => {
    const r = simulate(ui.cfg, N);
    const pct = x => Math.round(100 * x / N) + '%', avg = x => (x / N).toFixed(1);
    ui.simResult = `<b style="color:var(--thief)">Thief ${pct(r.thief)}</b> · <b style="color:var(--police)">Police ${pct(r.caught + r.time)}</b>
      <span class="muted">(caught ${pct(r.caught)}, time-out ${pct(r.time)}) · avg ${avg(r.turns)} turns ·
      per game: ${avg(r.spawned)} boxes, ${avg(r.used)} power-ups used, ${avg(r.events)} events</span>
      <div class="muted small">Basic AI vs basic AI on ${N} random maps — a rough balance signal, not the truth.</div>`;
    el.innerHTML = ui.simResult;
  }, 20);
}

/* ---------- events ---------- */
boardEl.addEventListener('click', e => {
  if (ui.screen !== 'plan') return;
  const edge = e.target.closest('.edge-target');
  if (edge && ui.targeting) return aimAt(t => t.k === edge.dataset.edge);
  const cell = e.target.closest('.hex');
  if (cell) clickCell({ q: +cell.dataset.q, r: +cell.dataset.r });
});

panelEl.addEventListener('click', e => {
  const b = e.target.closest('[data-act]');
  if (!b || b.disabled) return;
  const g = ui.game;
  switch (b.dataset.act) {
    case 'move': chooseStep(moveByName(b.dataset.move)); break;
    case 'power': clickPower(b.dataset.type); break;
    case 'lock': lockIn(); break;
    case 'menu': openMenu(); break;
    case 'rematch': startGame(g.cfg, ui.map, ui.playMode); break;
    case 'newmap': startGame(g.cfg, null, ui.playMode); break;
    case 'rp-prev': stopReplay(); setReplay(ui.replayK - 1); break;
    case 'rp-next': stopReplay(); setReplay(ui.replayK + 1); break;
    case 'rp-play': toggleReplay(); break;
  }
});
panelEl.addEventListener('change', e => {
  if (e.target.id === 'reveal') { ui.debugReveal = e.target.checked; renderBoard(); }
});
panelEl.addEventListener('input', e => {
  if (e.target.id === 'rpRange') { stopReplay(); setReplay(+e.target.value); }
});

overlayEl.addEventListener('click', e => {
  const b = e.target.closest('[data-act]');
  if (!b) return;
  switch (b.dataset.act) {
    case 'mode':
      ui.mode = b.dataset.mode; store.set('chase.mode', ui.mode);
      overlayEl.querySelectorAll('[data-act="mode"]').forEach(x => x.classList.toggle('on', x === b));
      break;
    case 'start': startGame(ui.cfg, null, ui.mode); break;
    case 'resume': ui.screen = ui.playMode === 'hotseat' ? 'cover' : 'plan'; render(); break;
    case 'show-view': ui.screen = 'plan'; render(); break;
    case 'reset-cfg':
      ui.cfg = { ...DEFAULT_CFG }; store.set('chase.cfg.v3', ui.cfg); ui.simResult = '';
      render(); $('#settings').open = true;
      break;
    case 'simulate': runSim(); break;
  }
});
overlayEl.addEventListener('change', e => {
  const k = e.target.dataset.cfg;
  if (!k) return;
  const s = SETTINGS.find(s => s.k === k);
  ui.cfg[k] = s.type === 'bool' ? e.target.checked : clamp(parseInt(e.target.value, 10) || s.min, s.min, s.max);
  ui.cfg.lootToWin = Math.min(ui.cfg.lootToWin, ui.cfg.chests);
  store.set('chase.cfg.v3', ui.cfg);
  overlayEl.querySelectorAll('[data-cfg]').forEach(inp => {
    if (inp.type === 'checkbox') inp.checked = ui.cfg[inp.dataset.cfg];
    else inp.value = ui.cfg[inp.dataset.cfg];
  });
  $('#rules').innerHTML = rulesHTML(ui.cfg);
  ui.simResult = ''; $('#sim').innerHTML = '';
});

// Hex keys around S on a staggered keyboard: W E / A (S) D / Z X
const KEYS = {
  w: 'north-west', e: 'north-east', a: 'west', d: 'east', z: 'south-west', x: 'south-east',
  arrowleft: 'west', arrowright: 'east', s: 'wait', ' ': 'wait',
};
document.addEventListener('keydown', e => {
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  if (e.target.matches && e.target.matches('input, select, textarea')) return;
  const k = e.key.toLowerCase();
  if (ui.screen === 'cover' && (k === 'enter' || k === ' ')) { e.preventDefault(); ui.screen = 'plan'; render(); return; }
  if (ui.screen === 'over') {
    if (k === 'arrowleft') { e.preventDefault(); stopReplay(); setReplay(ui.replayK - 1); }
    if (k === 'arrowright') { e.preventDefault(); stopReplay(); setReplay(ui.replayK + 1); }
    return;
  }
  if (ui.screen !== 'plan') return;
  if (k === 'enter') { e.preventDefault(); lockIn(); return; }
  if (k === 'escape' && ui.targeting) { ui.targeting = null; render(); return; }
  if (/^[1-9]$/.test(k)) { const t = POOL[ui.active][+k - 1]; if (t) { e.preventDefault(); clickPower(t); } return; }
  if (KEYS[k]) { e.preventDefault(); chooseStep(moveByName(KEYS[k])); }
});

// Handy for poking at the engine from the console.
window.chase = {
  ui, simulate: (n = 300, cfg = ui.cfg) => simulate(cfg, n),
  genMap, newGame, resolve, aiThief, aiPolice, useInstant, targetsFor, distField, legalMoves, isConnected, boardCells,
};

render();
})();
</script>
